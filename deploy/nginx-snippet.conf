# Merge inside the existing HTTPS server block after reviewing existing routes.
# In http {} (not server {}), define a shared rate-limit zone:
# limit_req_zone $binary_remote_addr zone=ciphermate_api:10m rate=5r/s;
location = /ciphermate { return 308 /ciphermate/; }
location /ciphermate/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /api/ciphermate/ {
    client_max_body_size 5m;
    client_body_timeout 15s;
    limit_req zone=ciphermate_api burst=15 nodelay;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    access_log off; # avoid filenames in query logs; retain separate safe metrics
}
